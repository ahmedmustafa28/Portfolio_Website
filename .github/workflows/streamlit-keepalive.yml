name: Check Streamlit Demos Availability

on:
  schedule:
    # Run at 12:00 UTC every 3 days to keep the Streamlit Cloud containers warm
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  check-demos:
    name: Health Check Live Applications
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - name: Olympics Data Analysis
            url: https://olympics-data-analysis-ml.streamlit.app/
          - name: WhatsApp Chat Analyzer
            url: https://whatsapp-chat-analyzer.streamlit.app/
          - name: Spam Email Detector
            url: https://spam-email-detector-28.streamlit.app/
          - name: House Price Prediction
            url: https://house-price-prediction-fgzympdk9mmp4dvinf5vdd.streamlit.app/
    steps:
      - name: Ping ${{ matrix.app.name }}
        run: |
          echo "Checking ${{ matrix.app.name }} ..."
          HTTP_STATUS=$(curl -sSL -w "%{http_code}" \
            -o /dev/null \
            --max-time 60 \
            -c /tmp/cookies.txt \
            -b /tmp/cookies.txt \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "${{ matrix.app.url }}" || echo "FAILED")
          rm -f /tmp/cookies.txt
          echo "HTTP status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" = "200" ] || [ "$HTTP_STATUS" = "303" ]; then
            RESULT="✅ Online"
          else
            RESULT="⚠️ Needs attention / sleeping (status $HTTP_STATUS)"
            echo "::warning::${{ matrix.app.name }} check returned status: $HTTP_STATUS"
          fi

          echo "| ${{ matrix.app.name }} | $RESULT |" >> "$GITHUB_STEP_SUMMARY"
